name: Astryx CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Pull your engine source repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull the vcpkg source release directly via Git clone
      - name: Checkout vcpkg source code
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: '5b1214315250939257ef5d62ecdcbca18cf4fb1c'
          path: vcpkg

      # Cleanly install system build tools, compilers, and Linux graphics headers
      - name: Install System Build Tools & Graphic Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build tar unzip curl libgl1-mesa-dev xorg-dev

      # Bootstrap vcpkg natively 
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      # Native CMake configuration using GCC, Ninja, and the toolchain path
      - name: Configure CMake
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -G Ninja

      #Build the engine and targets using Ninja
      - name: Build Project
        run: cmake --build build --config Release

      # Run the test suite via CTest
      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure -C Release
