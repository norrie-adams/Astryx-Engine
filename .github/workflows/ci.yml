name: Astryx CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Pull code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup your concrete engine stack: G++, Ninja, and vcpkg deps
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build tar unzip curl

      # Download/bootstrap vcpkg cleanly without executing internal installations
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '5b1214315250939257ef5d62ecdcbca18cf4fb1c'
          runVcpkgInstall: false # Let CMake handle it natively during generation

      # Generate with Ninja and G++
      - name: Configure CMake
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      # Compile using Ninja
      - name: Build Project
        run: cmake --build build --config Release

      # Test
      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure -C Release
